spring.application.name=nexfleet-gateway
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
bff.url=${BFF_URL:http://localhost:8090}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=25s
identidade.url=${IDENTIDADE_URL:http://localhost:8081}
frota.url=${FROTA_URL:http://localhost:8082}
operacoes.url=${OPERACOES_URL:http://localhost:8083}
indicadores.url=${INDICADORES_URL:http://localhost:8084}
# Swagger UI única: seletor com o OpenAPI de cada serviço, lido pelas rotas /docs/<svc>/v3/api-docs.
# Não desligar springdoc.api-docs.enabled: isso derruba também a UI.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=BFF
springdoc.swagger-ui.urls[0].url=/docs/bff/v3/api-docs
springdoc.swagger-ui.urls[1].name=Frota
springdoc.swagger-ui.urls[1].url=/docs/frota/v3/api-docs
springdoc.swagger-ui.urls[2].name=Opera\u00e7\u00f5es
springdoc.swagger-ui.urls[2].url=/docs/operacoes/v3/api-docs
springdoc.swagger-ui.urls[3].name=Identidade
springdoc.swagger-ui.urls[3].url=/docs/identidade/v3/api-docs
springdoc.swagger-ui.urls[4].name=Indicadores
springdoc.swagger-ui.urls[4].url=/docs/indicadores/v3/api-docs
springdoc.swagger-ui.urls-primary-name=BFF
